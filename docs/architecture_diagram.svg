<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box { fill: #ffffff; stroke: #3b4a5a; stroke-width: 2; rx: 10; }
    .ai  { fill: #eef3ff; stroke: #3457b2; stroke-width: 2; rx: 10; }
    .gate{ fill: #fff4e5; stroke: #b8650a; stroke-width: 2; rx: 10; }
    .data{ fill: #eafaf0; stroke: #1f8a4c; stroke-width: 2; rx: 10; }
    .title { font-size: 22px; font-weight: 700; fill: #1b2430; }
    .label { font-size: 15px; font-weight: 700; fill: #1b2430; }
    .sub   { font-size: 12.5px; fill: #44506080; }
    .sub2  { font-size: 12.5px; fill: #44506090; }
    .small { font-size: 11.5px; fill: #5a6676; }
    .arrow { stroke: #5a6676; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    .legend-ai { fill: #3457b2; }
    .legend-gate { fill: #b8650a; }
    .legend-data { fill: #1f8a4c; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#5a6676" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1500" height="900" fill="#ffffff"/>
  <text x="40" y="40" class="title">Agent Zero — Agentic Legacy Migration Platform: Architecture</text>
  <text x="40" y="62" class="small">EXL × UCD Data &amp; AI Hackathon 2026 · Challenge 03</text>

  <!-- Legend -->
  <rect x="1180" y="20" width="14" height="14" class="legend-ai"/>
  <text x="1200" y="31" class="small">AI model (Claude Code, claude -p)</text>
  <rect x="1180" y="42" width="14" height="14" class="legend-gate"/>
  <text x="1200" y="53" class="small">Human / CI review gate</text>
  <rect x="1180" y="64" width="14" height="14" class="legend-data"/>
  <text x="1200" y="75" class="small">Data store</text>

  <!-- Legacy estate -->
  <rect x="40" y="110" width="220" height="90" class="box"/>
  <text x="150" y="140" class="label" text-anchor="middle">Legacy estate</text>
  <text x="150" y="160" class="sub" text-anchor="middle">legacy/*.sql (T-SQL)</text>
  <text x="150" y="176" class="sub" text-anchor="middle">legacy/*.sas (SAS)</text>

  <!-- Synthetic data -->
  <rect x="40" y="260" width="220" height="90" class="data"/>
  <text x="150" y="290" class="label" text-anchor="middle">Synthetic data</text>
  <text x="150" y="310" class="sub" text-anchor="middle">policies / claims / premiums</text>
  <text x="150" y="326" class="sub" text-anchor="middle">generate_synthetic_data.py, seed=42</text>

  <!-- Legacy baselines -->
  <rect x="40" y="410" width="220" height="110" class="data"/>
  <text x="150" y="440" class="label" text-anchor="middle">Legacy baselines</text>
  <text x="150" y="460" class="sub" text-anchor="middle">pandas reference impl of</text>
  <text x="150" y="476" class="sub" text-anchor="middle">each job's logic</text>
  <text x="150" y="494" class="sub" text-anchor="middle">(1 job SQL Server-validated)</text>

  <!-- Discovery agent -->
  <rect x="340" y="110" width="240" height="110" class="ai"/>
  <text x="460" y="138" class="label" text-anchor="middle">Discovery / lineage agent</text>
  <text x="460" y="158" class="sub" text-anchor="middle">agents/discovery.py</text>
  <text x="460" y="176" class="sub" text-anchor="middle">claude -p -&gt; column lineage +</text>
  <text x="460" y="192" class="sub" text-anchor="middle">migration wave (JSON, schema-checked)</text>

  <!-- Translation agent -->
  <rect x="340" y="260" width="240" height="110" class="ai"/>
  <text x="460" y="288" class="label" text-anchor="middle">Translation agent</text>
  <text x="460" y="308" class="sub" text-anchor="middle">agents/translate.py</text>
  <text x="460" y="326" class="sub" text-anchor="middle">claude -p -&gt; PySpark job</text>
  <text x="460" y="342" class="sub" text-anchor="middle">(ast-validated before write)</text>

  <!-- Test-gen agent -->
  <rect x="340" y="410" width="240" height="110" class="ai"/>
  <text x="460" y="438" class="label" text-anchor="middle">Test-generation agent</text>
  <text x="460" y="458" class="sub" text-anchor="middle">agents/testgen.py</text>
  <text x="460" y="476" class="sub" text-anchor="middle">claude -p -&gt; pytest module</text>
  <text x="460" y="492" class="sub" text-anchor="middle">(ast-validated before write)</text>

  <!-- PySpark jobs -->
  <rect x="640" y="260" width="220" height="90" class="data"/>
  <text x="750" y="290" class="label" text-anchor="middle">Migrated PySpark jobs</text>
  <text x="750" y="310" class="sub" text-anchor="middle">pyspark_jobs/*.py</text>
  <text x="750" y="326" class="sub" text-anchor="middle">one per legacy job</text>

  <!-- Tests -->
  <rect x="640" y="410" width="220" height="90" class="data"/>
  <text x="750" y="440" class="label" text-anchor="middle">Generated tests</text>
  <text x="750" y="460" class="sub" text-anchor="middle">tests/test_&lt;job&gt;.py</text>
  <text x="750" y="476" class="sub" text-anchor="middle">66/66 passing</text>

  <!-- Reconciliation engine -->
  <rect x="920" y="335" width="260" height="110" class="box"/>
  <text x="1050" y="363" class="label" text-anchor="middle">Reconciliation engine</text>
  <text x="1050" y="383" class="sub" text-anchor="middle">reconciliation/engine.py</text>
  <text x="1050" y="401" class="sub" text-anchor="middle">row counts · column totals ·</text>
  <text x="1050" y="417" class="sub" text-anchor="middle">record-level equality</text>

  <!-- Report -->
  <rect x="1240" y="335" width="220" height="110" class="data"/>
  <text x="1350" y="365" class="label" text-anchor="middle">Pass/fail report</text>
  <text x="1350" y="385" class="sub" text-anchor="middle">reconciliation/report.md</text>
  <text x="1350" y="403" class="sub" text-anchor="middle">+ per-job reports,</text>
  <text x="1350" y="419" class="sub" text-anchor="middle">baseline provenance stated</text>

  <!-- Review gate -->
  <rect x="340" y="620" width="520" height="130" class="gate"/>
  <text x="600" y="650" class="label" text-anchor="middle">Human review gate</text>
  <text x="600" y="672" class="sub" text-anchor="middle">Every agent write lands on a branch -&gt; GitLab merge request</text>
  <text x="600" y="690" class="sub" text-anchor="middle">Claude Reviewer (CI, claude -p) flags Critical/Optional findings</text>
  <text x="600" y="708" class="sub" text-anchor="middle">+ human (Aditya) approval -&gt; only then merged to main</text>
  <text x="600" y="736" class="small" text-anchor="middle">Nothing an agent writes counts as "done" until it passes this gate</text>

  <!-- Operate (design note, not built) -->
  <rect x="920" y="620" width="540" height="130" class="box" stroke-dasharray="6,4"/>
  <text x="1190" y="650" class="label" text-anchor="middle">Operate (design only — not built tonight)</text>
  <text x="1190" y="674" class="sub" text-anchor="middle">Scheduler (e.g. cron/Airflow) would run pyspark_jobs/*.py</text>
  <text x="1190" y="692" class="sub" text-anchor="middle">on a wave schedule, publish lineage to a catalog,</text>
  <text x="1190" y="710" class="sub" text-anchor="middle">and alert on reconciliation report.md regressions</text>

  <!-- Arrows -->
  <path class="arrow" d="M150,200 L150,258"/>
  <path class="arrow" d="M260,155 L338,155"/>
  <path class="arrow" d="M260,305 L338,305"/>
  <path class="arrow" d="M150,350 L150,408"/>
  <path class="arrow" d="M460,220 L460,258"/>
  <path class="arrow" d="M460,370 L460,408"/>
  <path class="arrow" d="M580,305 L638,305"/>
  <path class="arrow" d="M580,465 L638,465"/>
  <path class="arrow" d="M750,350 Q820,390 918,405"/>
  <path class="arrow" d="M750,500 Q820,460 918,420"/>
  <path class="arrow" d="M260,465 L300,465 L300,560 L900,560 L900,425 L918,425"/>
  <path class="arrow" d="M1180,390 L1238,390"/>

  <text x="40" y="800" class="small">Phases: Discover (legacy estate, data) · Design (this diagram) · Generate (agents) · Reconcile (engine) · Operate (design note)</text>
  <text x="40" y="820" class="small">AI model used everywhere above: Claude Code, headless (`claude -p`) — same model family throughout, no other AI/ML service in this project.</text>
</svg>
